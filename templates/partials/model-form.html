<!-- GAME CREATE -->
<form method="post"
      class="mt-6 space-y-4 rounded-xl border border-slate-800/80 bg-slate-900/60 p-4 shadow-xl shadow-slate-950/20 sm:p-5">
    {% csrf_token %}
    {% if form.non_field_errors %}
        <!-- CREATE FORM -->
        <div class="rounded-xl border border-rose-500/30 bg-rose-500/10 p-4">
            {% for error in form.non_field_errors %}
                <p class="text-sm font-medium text-rose-300">{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
    {% for field in form %}
        {% include "partials/form-field.html" with field=field %}
    {% endfor %}
    <!-- BUTTONS -->
    <div class="flex flex-wrap gap-3 border-t border-slate-800 pt-6">
        <!-- SUBMIT -->
        <button type="submit"
                class="rounded-xl bg-cyan-300 px-4 py-2.5 text-sm font-semibold text-slate-950 transition hover:bg-cyan-200">
            {{ submit_label }}
        </button>
        <!-- CANCEL -->
        <a href="{{ cancel_url }}"
           class="rounded-xl border border-slate-700 px-4 py-2.5 text-sm font-semibold text-slate-300 transition hover:border-slate-500 hover:text-white">
            Cancel
        </a>
    </div>
</form>
